<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Calque</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  @font-face{font-family:"Bricolage Grotesque";font-weight:500;font-display:swap;src:url(fonts/bricolage-grotesque-latin-500-normal.woff2) format("woff2")}
  @font-face{font-family:"Bricolage Grotesque";font-weight:800;font-display:swap;src:url(fonts/bricolage-grotesque-latin-800-normal.woff2) format("woff2")}
  @font-face{font-family:"Space Mono";font-weight:400;font-display:swap;src:url(fonts/space-mono-latin-400-normal.woff2) format("woff2")}
  @font-face{font-family:"Space Mono";font-weight:700;font-display:swap;src:url(fonts/space-mono-latin-700-normal.woff2) format("woff2")}

  :root{
    --paper:#ECEAE4;     /* fond des panneaux */
    --ink:#111111;       /* texte, bordures */
    --pink:#FF4F9A;      /* accent principal : texte noir dessus */
    --blue:#2C4BD8;      /* accent secondaire : texte blanc dessus */
    --white:#FFFFFF;     /* cartes */
    --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
    --mono:"Space Mono",ui-monospace,monospace;
    --line:2px solid var(--ink);
    --side:min(300px,45vw);  /* panneau latéral en paysage */
    color-scheme:light;
  }
  *,*::before,*::after{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--ink)}
  body{
    font-family:var(--display);font-weight:500;color:var(--ink);
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }
  .tag{font:400 12px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.08em}

  /* ---------- scène : caméra + modèle ---------- */
  #stage{position:fixed;inset:0;overflow:hidden;background:#000}
  #cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
  /* jamais de bouton lecture/pause natif par-dessus la caméra (Chrome Android) */
  #cam::-webkit-media-controls,#cam::-webkit-media-controls-overlay-play-button,
  #cam::-webkit-media-controls-start-playback-button{display:none!important;-webkit-appearance:none}

  #layer{position:absolute;inset:0;pointer-events:none}
  #art{
    position:absolute;left:50%;top:50%;
    max-width:none;transform-origin:center center;
    will-change:transform;image-rendering:auto;
  }
  #art.hidden{display:none}
  .peek #art,.peek #grid{visibility:hidden}
  /* grille de report : mêmes dimensions et même transformation que l'image */
  #grid{
    position:absolute;left:50%;top:50%;transform-origin:center center;
    --gc:rgba(44,75,216,.9);
    background-image:
      linear-gradient(to right,var(--gc) var(--gw,1px),transparent var(--gw,1px)),
      linear-gradient(to bottom,var(--gc) var(--gw,1px),transparent var(--gw,1px));
    background-size:var(--cw) var(--ch);
    box-shadow:inset calc(-1 * var(--gw,1px)) calc(-1 * var(--gw,1px)) 0 var(--gc);
  }

  /* ---------- boutons : angles droits, bordure noire 2px, 44px minimum ---------- */
  button,label.btn{
    font:500 15px/1 var(--display);color:var(--ink);
    background:var(--paper);border:var(--line);border-radius:0;
    min-width:44px;min-height:44px;padding:0 14px;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    flex:0 0 auto;cursor:pointer;-webkit-user-select:none;user-select:none;
  }
  button:active,label.btn:active{transform:translate(2px,2px)}
  button:focus-visible,label.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .sq,label.btn.sq{width:44px;height:44px;padding:0}
  svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:square;stroke-linejoin:miter}
  /* actifs : rose (texte noir) pour le rendu et le verrou, bleu (texte blanc) pour les options */
  .seg button[aria-pressed="true"],#lockBtn[aria-pressed="true"]{background:var(--pink);color:var(--ink)}
  .tools button[aria-pressed="true"]{background:var(--blue);color:var(--white)}
  #lockBtn .closed,#lockBtn[aria-pressed="true"] .open{display:none}
  #lockBtn[aria-pressed="true"] .closed{display:block}

  /* ---------- barre du haut : carrés bordés de noir ---------- */
  .bar{
    position:absolute;left:0;right:0;z-index:5;
    display:flex;gap:8px;align-items:center;
    transition:opacity .18s ease;
  }
  #top{top:0;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px}
  #top .row{display:flex;gap:8px}
  body.bare .bar,body.bare #panel{opacity:0;pointer-events:none}
  body.bare #peek{opacity:1;pointer-events:auto}

  /* ---------- panneau du bas ---------- */
  #panel{
    position:absolute;left:0;right:0;bottom:0;z-index:5;
    background:var(--paper);border-top:var(--line);
    padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));
    display:flex;flex-direction:column;gap:12px;
    transition:opacity .18s ease;
  }
  .opa{display:flex;align-items:center;gap:12px}
  .opa .tag{min-width:62px}
  #opv::after{content:"%";font-weight:500;font-size:13px;margin-left:1px}
  #opv{font:800 18px/1 var(--display);min-width:4.2ch;text-align:right;font-variant-numeric:tabular-nums}
  .tools{display:flex;flex-wrap:wrap;gap:6px}
  /* rendus : boutons accolés, bordures partagées */
  .seg{display:flex;flex-wrap:wrap}
  .seg button{padding:0 11px;font-size:14px}
  .seg button+button{margin-left:-2px}
  input[type=range]{flex:1;min-width:0;height:44px;margin:0;-webkit-appearance:none;appearance:none;background:transparent}
  input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--ink)}
  input[type=range]::-moz-range-track{height:4px;background:var(--ink)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:24px;height:24px;margin-top:-10px;
    background:var(--pink);border:var(--line);border-radius:0;
  }
  input[type=range]::-moz-range-thumb{width:24px;height:24px;background:var(--pink);border:var(--line);border-radius:0}

  #peek{
    position:absolute;z-index:6;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));
    box-shadow:6px 6px 0 var(--pink);
    opacity:0;pointer-events:none;transition:opacity .18s ease;
  }

  /* ---------- accueil ---------- */
  #intro{
    position:absolute;inset:0;z-index:10;display:flex;overflow:auto;
    background:var(--paper);color:var(--ink);
    padding:calc(28px + env(safe-area-inset-top,0px)) 24px calc(28px + env(safe-area-inset-bottom,0px));
  }
  #intro.gone{display:none}
  #intro .wrap{margin:auto 0;width:100%;max-width:560px;display:flex;flex-direction:column;gap:26px}
  #intro h1{
    margin:0;font:800 clamp(56px,17vw,148px)/.86 var(--display);letter-spacing:-.035em;
    text-shadow:3px 2px 0 rgba(44,75,216,.55);   /* mauvais repérage riso */
  }
  #intro .side{display:flex;flex-direction:column;align-items:flex-start;gap:20px}
  #intro .sub{margin:0;max-width:36ch;line-height:1.65;font-size:13px}
  #intro .go{
    background:var(--ink);color:var(--paper);font-weight:800;font-size:18px;
    min-height:56px;padding:0 24px;box-shadow:6px 6px 0 var(--pink);
  }
  .ticket{
    flex-direction:column;align-items:flex-start;gap:6px;text-align:left;
    width:min(100%,340px);padding:14px 16px;
    background:var(--white);border:2px dashed var(--ink);box-shadow:6px 6px 0 var(--blue);
  }
  .ticket strong{font:800 20px/1.1 var(--display)}
  #err{
    margin:0;padding:10px 12px;max-width:40ch;line-height:1.5;
    background:var(--white);border:var(--line);box-shadow:6px 6px 0 var(--blue);
  }
  #intro .foot{margin:0;font-size:11px}
  input[type=file]{display:none}

  /* ---------- téléphone en paysage : panneau à droite en colonne, barre réduite ---------- */
  @media (orientation:landscape) and (max-height:767px){
    #layer{right:var(--side)}   /* l'image se centre dans la zone libre */
    #top{right:var(--side);padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px calc(10px + env(safe-area-inset-left,0px))}
    #panel{
      top:0;left:auto;width:var(--side);border-top:0;border-left:var(--line);
      overflow-y:auto;gap:10px;
      padding:calc(10px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) 10px 14px;
    }
    .seg{gap:6px}
    .seg button+button{margin-left:0}
    #intro .wrap{max-width:none;flex-direction:row;align-items:center;gap:36px}
    #intro h1{font-size:min(17vw,20vh,96px);flex:0 0 auto}
    #intro .side{gap:16px}
  }

  /* ---------- tablette : panneau en carte flottante ---------- */
  @media (min-width:768px) and (min-height:768px){
    #top{padding:calc(20px + env(safe-area-inset-top,0px)) 24px 20px}
    #panel{
      left:0;right:0;margin:0 auto;bottom:calc(24px + env(safe-area-inset-bottom,0px));
      width:min(420px,calc(100% - 48px));
      border:var(--line);box-shadow:6px 6px 0 var(--pink);padding:18px;
    }
    #peek{right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px))}
    #intro{padding:48px}
    #intro .wrap{max-width:760px;margin:auto}
    #intro .sub{font-size:14px}
  }
  @media (min-width:768px) and (min-height:768px) and (orientation:landscape){
    #panel{left:auto;right:24px;margin:0}
  }

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="stage">
  <video id="cam" playsinline muted autoplay disablepictureinpicture disableremoteplayback></video>
  <div id="layer"><img id="art" alt=""><div id="grid" hidden></div></div>

  <div class="bar" id="top">
    <button class="sq" id="bareBtn" title="Masquer les réglages" aria-label="Masquer les réglages">
      <svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18"/><path d="M3 15h18"/></svg>
    </button>
    <div class="row">
      <button class="sq" id="lockBtn" aria-pressed="false" title="Verrouiller l'image" aria-label="Verrouiller l'image">
        <svg class="i open" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10"/><path d="M8 11V7a4 4 0 0 1 7.6-1.7"/></svg>
        <svg class="i closed" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </button>
      <label class="btn sq" id="swapBtn" for="file" role="button" tabindex="0" title="Changer d'image" aria-label="Changer d'image">
        <svg class="i" viewBox="0 0 24 24"><path d="M4 8h15M15 4l4 4-4 4M20 16H5M9 12l-4 4 4 4"/></svg>
      </label>
    </div>
  </div>

  <button class="sq" id="peek" title="Afficher les réglages" aria-label="Afficher les réglages">
    <svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18"/><path d="M3 15h18"/></svg>
  </button>

  <div id="panel">
    <div class="opa">
      <label class="tag" for="op">Opacité</label>
      <input type="range" id="op" min="5" max="100" value="45">
      <output id="opv" for="op">45</output>
    </div>
    <div class="seg" role="group" aria-label="Rendu de l'image">
      <button data-mode="photo" aria-pressed="true">Photo</button>
      <button data-mode="contrast" aria-pressed="false">Contraste</button>
      <button data-mode="lines" aria-pressed="false">Contours</button>
      <button data-mode="invert" aria-pressed="false">Négatif</button>
    </div>
    <div class="tools" role="group" aria-label="Options">
      <button id="mirrorBtn" aria-pressed="false">Miroir</button>
      <button id="gridBtn" aria-pressed="false">Grille</button>
      <button id="torchBtn" aria-pressed="false" hidden>Lampe</button>
      <button id="focusBtn" aria-pressed="false" hidden title="Bloquer la mise au point">Netteté fixe</button>
    </div>
  </div>
</div>

<div id="intro">
  <div class="wrap">
    <h1>DÉCALQUE<br>TOUT.</h1>
    <div class="side">
      <p class="sub tag">Choisis une image, elle se superpose à la caméra. Tu décalques en regardant l'écran.</p>
      <label class="btn go" id="pick" for="file" role="button" tabindex="0">Choisir une image →</label>
      <button class="ticket" id="resume" hidden>
        <span class="tag">Reprendre</span>
        <strong>Ton dernier calque</strong>
      </button>
      <p id="err" class="tag" hidden></p>
      <p class="foot tag">Rien ne quitte ton téléphone.</p>
    </div>
  </div>
</div>

<input type="file" id="file" accept="image/*">

<script>
(() => {
  const $ = s => document.querySelector(s);
  const cam = $('#cam'), art = $('#art'), file = $('#file'), intro = $('#intro'), err = $('#err');

  // ---------- état de la transformation ----------
  const T = { x:0, y:0, scale:1, rot:0 };
  let mirrored = false, locked = false;
  const grid = $('#grid');
  const apply = () => {
    art.style.transform =
      `translate(-50%, -50%) translate(${T.x}px, ${T.y}px) rotate(${T.rot}deg) scale(${T.scale * (mirrored ? -1 : 1)}, ${T.scale})`;
    grid.style.transform = art.style.transform;
    grid.style.setProperty('--gw', (1.5 / T.scale) + 'px'); // traits ~1,5 px à l'écran quel que soit le zoom
  };

  // ---------- caméra ----------
  async function startCam() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 } },
        audio: false
      });
      cam.srcObject = stream;
      await cam.play();
      camControls(stream.getVideoTracks()[0]);
      return true;
    } catch (e) {
      show(e.name === 'NotAllowedError'
        ? "Accès caméra refusé. Autorise la caméra dans les réglages du site, puis recharge."
        : "Caméra indisponible. Il faut une connexion HTTPS et, sur iPhone, Safari directement.");
      return false;
    }
  }
  // Options matérielles : boutons affichés seulement si la caméra les supporte
  function camControls(track) {
    const caps = (track && track.getCapabilities) ? track.getCapabilities() : {};
    const torchBtn = $('#torchBtn');
    torchBtn.hidden = !caps.torch;
    torchBtn.setAttribute('aria-pressed', 'false');
    torchBtn.onclick = async () => {
      const on = torchBtn.getAttribute('aria-pressed') !== 'true';
      try {
        await track.applyConstraints({ advanced: [{ torch: on }] });
        torchBtn.setAttribute('aria-pressed', String(on));
      } catch { torchBtn.hidden = true; }
    };

    // Mise au point figée à la distance actuelle : la main qui passe ne fait plus « pomper » l'autofocus
    const focusBtn = $('#focusBtn'), modes = caps.focusMode || [];
    focusBtn.hidden = !modes.includes('manual');
    focusBtn.setAttribute('aria-pressed', 'false');
    focusBtn.onclick = async () => {
      const on = focusBtn.getAttribute('aria-pressed') !== 'true';
      let c;
      if (on) {
        c = { focusMode: 'manual' };
        const d = track.getSettings().focusDistance;
        if (caps.focusDistance && d != null) c.focusDistance = d;
      } else {
        c = { focusMode: modes.includes('continuous') ? 'continuous' : modes.find(m => m !== 'manual') };
      }
      try {
        await track.applyConstraints({ advanced: [c] });
        focusBtn.setAttribute('aria-pressed', String(on));
      } catch { focusBtn.hidden = true; }
    };
  }
  function show(msg){ err.hidden = false; err.textContent = msg; }

  // ---------- écran qui reste allumé ----------
  let wl = null;
  async function keepAwake() {
    if (!('wakeLock' in navigator)) return;
    try {
      wl = await navigator.wakeLock.request('screen');
      wl.addEventListener('release', () => { wl = null; }); // libéré au verrouillage : à redemander
    } catch {}
  }
  // Au déverrouillage, Android a coupé la caméra et mis la vidéo en pause : on relance tout
  async function resumeCam() {
    if (!cam.srcObject) return;                       // caméra jamais démarrée (écran d'accueil)
    const t = cam.srcObject.getVideoTracks()[0];
    if (!t || t.readyState === 'ended') await startCam();
    else if (cam.paused) cam.play().catch(() => {});
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (!wl) keepAwake();
    resumeCam();
  });

  // ---------- détection de contours (Sobel) ----------
  function makeEdges(img) {
    const max = 1400;
    const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * r), h = Math.round(img.naturalHeight * r);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(img, 0, 0, w, h);
    const src = ctx.getImageData(0, 0, w, h), d = src.data;
    const g = new Float32Array(w * h);
    for (let i = 0, p = 0; i < d.length; i += 4, p++)
      g[p] = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];

    const out = ctx.createImageData(w, h), o = out.data;
    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        const i = y * w + x;
        const a=g[i-w-1],b=g[i-w],c2=g[i-w+1],e=g[i-1],f=g[i+1],
              j=g[i+w-1],k=g[i+w],l=g[i+w+1];
        const gx = (c2 + 2*f + l) - (a + 2*e + j);
        const gy = (j + 2*k + l) - (a + 2*b + c2);
        let m = Math.hypot(gx, gy) / 4;          // 0..~255
        m = m < 28 ? 0 : Math.min(255, m * 1.8); // seuil + gain
        const p = i * 4;
        o[p] = 255; o[p+1] = 79; o[p+2] = 154;   // trait rose riso (--pink)
        o[p+3] = m;                              // alpha = force du contour
      }
    }
    ctx.putImageData(out, 0, 0);
    return c.toDataURL('image/png');
  }

  // ---------- chargement d'une image ----------
  let srcPhoto = null, srcEdges = null, mode = 'photo';

  function fit(img) {
    const L = $('#layer'), sw = L.clientWidth, sh = L.clientHeight;
    const s = Math.min(sw / img.naturalWidth, sh / img.naturalHeight) * 0.85;
    img.style.width = img.naturalWidth + 'px';
    img.style.height = img.naturalHeight + 'px';
    // grille : 6 cases sur le petit côté, cases presque carrées qui tombent juste sur les bords
    const w = img.naturalWidth, h = img.naturalHeight, cell = Math.min(w, h) / 6;
    grid.style.width = w + 'px'; grid.style.height = h + 'px';
    grid.style.setProperty('--cw', w / Math.max(1, Math.round(w / cell)) + 'px');
    grid.style.setProperty('--ch', h / Math.max(1, Math.round(h / cell)) + 'px');
    T.x = 0; T.y = 0; T.rot = 0; T.scale = s;
    apply();
  }

  file.addEventListener('change', () => {
    const f = file.files && file.files[0];
    if (!f) return;
    file.value = ''; // pour pouvoir rechoisir la même image (ex. après un refus caméra)
    const url = URL.createObjectURL(f);
    const probe = new Image();
    probe.onload = () => {
      srcPhoto = url;
      srcEdges = null;
      art.src = url;
      art.onload = async () => {
        art.onload = null;
        fit(art);
        if (!cam.srcObject && !(await startCam())) return;
        err.hidden = true;
        intro.classList.add('gone');
        keepAwake();
      };
      setMode('photo');
      // contours calculés en tâche de fond, prêts quand on clique dessus
      setTimeout(() => { try { srcEdges = makeEdges(probe); } catch {} }, 60);
    };
    probe.onerror = () => show("Image illisible. Essaie un JPG ou un PNG.");
    probe.src = url;
  });

  function setMode(m) {
    mode = m;
    document.querySelectorAll('[data-mode]').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
    if (m === 'lines') {
      if (srcEdges) art.src = srcEdges;
      art.style.filter = 'none';
    } else {
      if (srcPhoto && art.src !== srcPhoto) art.src = srcPhoto;
      art.style.filter =
        m === 'contrast' ? 'grayscale(1) contrast(2.3) brightness(1.05)' :
        m === 'invert'   ? 'invert(1) grayscale(1) contrast(1.4)' : 'none';
    }
  }
  document.querySelectorAll('[data-mode]').forEach(b =>
    b.addEventListener('click', () => setMode(b.dataset.mode)));

  // ---------- gestes : 1 doigt = déplacer, 2 doigts = zoom + rotation ----------
  const pts = new Map();
  let base = null;

  const pair = () => {
    const [a, b] = [...pts.values()];
    return {
      d: Math.hypot(b.x - a.x, b.y - a.y),
      a: Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI,
      cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2
    };
  };

  // ---------- appui long sur l'image : elle disparaît tant que le doigt reste posé ----------
  const HOLD_MS = 450, SLOP = 10;   // un doigt qui tremble de moins de SLOP px ne déplace rien
  let press = null;                 // { x, y, timer } tant que l'appui peut encore devenir long
  const stage = $('#stage');
  const peeking = () => stage.classList.contains('peek');
  const onArt = (x, y) => {          // point écran -> repère de l'image (inverse de apply())
    const L = $('#layer').getBoundingClientRect();
    const dx = x - (L.left + L.width / 2 + T.x), dy = y - (L.top + L.height / 2 + T.y);
    const r = -T.rot * Math.PI / 180;
    const u = (dx * Math.cos(r) - dy * Math.sin(r)) / T.scale;
    const v = (dx * Math.sin(r) + dy * Math.cos(r)) / T.scale;
    return Math.abs(u) <= art.offsetWidth / 2 && Math.abs(v) <= art.offsetHeight / 2;
  };
  const cancelPress = () => { if (press) clearTimeout(press.timer); press = null; };

  stage.addEventListener('pointerdown', e => {
    if (intro.classList.contains('gone') === false) return;
    if (cam.paused) resumeCam();
    if (e.target.closest('.bar, #panel, #peek')) return;
    stage.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    cancelPress();
    if (pts.size === 1 && onArt(e.clientX, e.clientY))
      press = { x: e.clientX, y: e.clientY,
                timer: setTimeout(() => { press = null; stage.classList.add('peek'); }, HOLD_MS) };
    base = pts.size === 2 ? { ...pair(), scale: T.scale, rot: T.rot, x: T.x, y: T.y } : null;
  });

  stage.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    let prev = pts.get(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (peeking()) return;
    if (press) {
      if (Math.hypot(e.clientX - press.x, e.clientY - press.y) < SLOP) return;
      prev = press; cancelPress();  // vrai glissé : on rattrape depuis le point de départ
    }
    if (locked) return;

    if (pts.size === 1) {
      T.x += e.clientX - prev.x;
      T.y += e.clientY - prev.y;
      apply();
    } else if (pts.size === 2 && base) {
      const now = pair();
      T.scale = Math.max(0.05, Math.min(14, base.scale * (now.d / base.d)));
      T.rot = base.rot + (now.a - base.a);
      T.x = base.x + (now.cx - base.cx);
      T.y = base.y + (now.cy - base.cy);
      apply();
    }
  });

  const drop = e => {
    pts.delete(e.pointerId);
    cancelPress();
    stage.classList.remove('peek');
    base = pts.size === 2 ? { ...pair(), scale: T.scale, rot: T.rot, x: T.x, y: T.y } : null;
  };
  stage.addEventListener('pointerup', drop);
  stage.addEventListener('pointercancel', drop);

  // ---------- contrôles ----------
  $('#op').addEventListener('input', e => { art.style.opacity = e.target.value / 100; $('#opv').value = e.target.value; });
  art.style.opacity = 0.45;

  $('#lockBtn').addEventListener('click', e => {
    locked = !locked;
    e.currentTarget.setAttribute('aria-pressed', String(locked));
    const t = locked ? "Déverrouiller l'image" : "Verrouiller l'image";
    e.currentTarget.title = t; e.currentTarget.setAttribute('aria-label', t);
    pts.clear(); base = null;
  });

  $('#gridBtn').addEventListener('click', e => {
    grid.hidden = !grid.hidden;
    e.currentTarget.setAttribute('aria-pressed', String(!grid.hidden));
  });

  $('#mirrorBtn').addEventListener('click', e => {
    mirrored = !mirrored;
    e.currentTarget.setAttribute('aria-pressed', String(mirrored));
    apply();
  });

  const bare = on => document.body.classList.toggle('bare', on);
  $('#bareBtn').addEventListener('click', () => bare(true));
  $('#peek').addEventListener('click', () => bare(false));

  // Clavier : Entrée/Espace sur les labels ouvrent le sélecteur (le clic natif du label suffit au tactile)
  document.querySelectorAll('label[for=file]').forEach(l =>
    l.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); l.click(); }
    }));

  // Recadre si l'écran tourne
  addEventListener('orientationchange', () => { if (art.src) setTimeout(() => fit(art), 300); });
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
